name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Build package
        run: |
          set -euo pipefail
          docker run --rm \
            -e IT_DOCKER_ROOT=/workspace \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -e GITHUB_REF_TYPE \
            -v "$PWD":/workspace \
            -w /workspace \
            archlinux:base-devel \
            bash -euo pipefail /workspace/packaging/arch/smoke-docker-inner.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

  appimage:
    name: AppImage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Build AppImage
        run: |
          set -euo pipefail
          docker run --rm \
            -e IT_DOCKER_ROOT=/workspace \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -e GITHUB_REF_TYPE \
            -v "$PWD":/workspace \
            -w /workspace \
            ubuntu:26.04 \
            bash -euo pipefail /workspace/packaging/appimage/smoke-docker-inner.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: packaging/appimage/*.AppImage
          if-no-files-found: error

  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive

      - name: Build and bundle Flatpak
        run: |
          set -euo pipefail
          docker run --rm --privileged \
            -e IT_DOCKER_ROOT=/workspace \
            -e GITHUB_REF \
            -e GITHUB_REF_NAME \
            -e GITHUB_REF_TYPE \
            -v "$PWD":/workspace \
            -w /workspace \
            ubuntu:latest \
            bash -euo pipefail /workspace/packaging/flatpak/smoke-docker-inner.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: packaging/flatpak/*.flatpak
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [arch, appimage, flatpak]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.pkg.tar.zst *.AppImage *.flatpak > SHA256SUMS
          ls -lh
          cat SHA256SUMS

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
